# The whole stack: docker compose up --build
#
#   ingestor-api  --report.uploaded-->  parser-worker  --report.parsed-->  analyzer-worker
#        \______________________ Postgres + pgvector ______________________/
#
# Kafka messages carry only {"reportId": N}; PDFs sit in the shared `reports` volume.

x-worker: &worker
  build: ./nlp-analyzer
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
  environment:
    DATABASE_URL: postgresql://esg:esg@postgres:5432/esg
    KAFKA_BOOTSTRAP: kafka:29092
    REPORTS_DIR: /data/reports
    HF_HOME: /models
  volumes:
    - reports:/data/reports
    - hf-cache:/models   # model downloads survive container rebuilds

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: esg
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: esg
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs only on a fresh volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg -d esg"]
      interval: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Containers use kafka:29092; tools on the host use localhost:9092.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    depends_on: [kafka]
    ports: ["9000:9000"]
    environment:
      KAFKA_BROKERCONNECT: kafka:29092

  ingestor-api:
    build: ./ingestor-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/esg
      DATABASE_USER: esg
      DATABASE_PASSWORD: esg
      KAFKA_BOOTSTRAP: kafka:29092
      REPORTS_DIR: /data/reports
    volumes:
      - reports:/data/reports

  parser-worker:
    <<: *worker
    command: ["python", "-m", "esg.workers.parser_worker"]

  analyzer-worker:
    <<: *worker
    command: ["python", "-m", "esg.workers.analyzer_worker"]

volumes:
  pgdata:
  reports:
  hf-cache:
