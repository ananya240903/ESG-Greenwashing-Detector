spring.application.name=disclosure-ingestor

# Postgres (+pgvector). The schema lives in db/init/001_schema.sql; Hibernate only checks it.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/esg}
spring.datasource.username=${DATABASE_USER:esg}
spring.datasource.password=${DATABASE_PASSWORD:esg}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.reports-dir=${REPORTS_DIR:../data/reports}

# Kafka carries report IDs only: {"reportId": 42}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# The Python workers have no use for Spring's Java type header.
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.report-uploaded=report.uploaded
app.kafka.topic.report-parsed=report.parsed
