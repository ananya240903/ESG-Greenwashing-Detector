spring.datasource.url=jdbc:h2:mem:esg;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.reports-dir=target/test-reports

# No broker in unit tests: the publisher is mocked, and topics are not created.
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.admin.auto-create=false
app.kafka.topic.report-uploaded=report.uploaded
app.kafka.topic.report-parsed=report.parsed
